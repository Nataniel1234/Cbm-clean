services:
  db:
    image: postgres:16-alpine
    container_name: cbm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbm}
      POSTGRES_DB: ${POSTGRES_DB:-cbmclean}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbm} -d ${POSTGRES_DB:-cbmclean}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
    container_name: cbm_api
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cbm}:${POSTGRES_PASSWORD:-cbm}@db:5432/${POSTGRES_DB:-cbmclean}?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: cbm_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  db_data:
