server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Ficheiros com hash podem ser cacheados agressivamente
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: qualquer rota devolve o index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
